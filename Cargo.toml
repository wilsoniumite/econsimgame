[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Fast iteration: our own code lightly optimised, dependencies (Bevy) fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The simulation runs inside the viewer during a game: keep it fast in debug builds too.
[profile.dev.package.isostate-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
