[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"

# Fast iteration: our own code lightly optimised, dependencies (Bevy) fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The simulation runs inside the viewer during a game: keep it fast in debug builds too.
[profile.dev.package.isostate-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# The working loop: release, but built in 256 pieces and kept between builds, so that after a
# one-line change to the core it builds again in about seven seconds where release takes three
# minutes or more. Each piece is still optimised with what it calls in the others (the default
# within the crate, `lto = false`); turning that off too saves two or three seconds and costs a
# quarter more time in every run. Runs give the same results as release to the last digit, and
# take 3 per cent longer: eight islands to 2050 took 72 s of processor time a run against 70 on
# 26 November 2026. Release stays what the gate, the golden hashes and the game as played use.
# cargo build --profile work -p isostate-core, then ./target/work/isostate-core.exe ...
[profile.work]
inherits = "release"
codegen-units = 256
lto = false
incremental = true

# A marked version's program (tools/release.py, docs/RELEASING.md): release itself, built in
# a folder of its own, target/dist, because the command builds it with the machine's folders
# taken out of the program (--remap-path-prefix), and those flags in target/release would make
# the tests' and the golden hashes' release builds start again from nothing. Taking the names
# and debugging information out (strip = true, debug = false) was measured and buys nothing on
# Windows, where release keeps them in a .pdb beside the program, which is not shipped: the
# program was 91,726,336 bytes with them out and 91,724,800 without (26 November 2026).
[profile.dist]
inherits = "release"
