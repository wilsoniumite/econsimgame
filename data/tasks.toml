# Isolated State: the classes of task, and the machines that can do them (docs/rules/tasks.md).
#
# Read by crates/isostate-core/src/tasks.rs into a table on the game's content (`Content::tasks`). Only
# the game's content has it: under the port's content the table is empty and nothing here is read.
#
# Every hour of work in a works or on the land is of one of five classes:
#   haul      lifting, carrying, turning a shaft, hewing, ploughing
#   tend      feeding and minding a process, fitting, driving, milking, reaping
#   clerk     records, reckoning, routine dealing
#   judge     design, selling, managing, knowing when to sow
#   presence  work that only a person may do, by its nature or by law: no machine may take it
#
# Within a class the tasks run from the easiest for a machine to the hardest. `spread` says, for each
# class a machine may enter, how many machine units a hand is worth at the easiest task (the knot at 0)
# and at the hardest (the knot at 1). With two knots the tasks lie evenly in the logarithm between
# them; more knots bend the schedule, and the code reads any number of them.
#
# A machine of quality q does the work of q units. Where a unit costs less a month than a hand is paid,
# divided by what the hand is worth there, the machine takes the task; so the share of a class that
# machines would hold in a town is where the town's wage over a unit's cost falls on the schedule.

[tasks]
classes = ["haul", "tend", "clerk", "judge", "presence"]
closed = ["presence"]

[tasks.spread]
haul = [[0.0, 0.3], [1.0, 100.0]]
tend = [[0.0, 1.0], [1.0, 1000.0]]
clerk = [[0.0, 1.0], [1.0, 3000.0]]
judge = [[0.0, 10.0], [1.0, 30000.0]]

# ----------------------------------------------------------------------------------------------------
# The works: each method's labour as shares of the five classes (haul, tend, clerk, judge, presence),
# by kind. Every one of the game's 46 methods is in one kind. A method this file does not name has
# no classes, and no machine for a task ever touches it.
# ----------------------------------------------------------------------------------------------------

[[kind]]
name = "furnaces, forges and rolling mills"
tasks = [0.45, 0.40, 0.03, 0.12, 0.0]
methods = ["bloomery", "charcoal_furnace", "coke_furnace", "hot_blast", "crucible_steel", "bessemer",
           "forge_rails", "rolling_mill", "steel_rolling"]
# Unsure: the bloomery is as much a hand trade as a furnace; it is gone by 1800 on every island, so
# nothing hangs on it.

[[kind]]
name = "mills and factories"
tasks = [0.20, 0.60, 0.05, 0.15, 0.0]
methods = ["textile_mill", "brickworks", "continuous_kiln", "steam_sawmill", "lime_kiln", "cement_works",
           "brewhouse", "steam_brewery", "potbank", "pottery_works", "gasworks", "edge_tool_works",
           "tool_factory", "soap_boilers", "alkali_works", "ammonia_soda", "glasshouse", "sheet_glass",
           "tank_furnace", "paper_mill", "machine_paper"]
# Unsure: the older works of the tree that make a good in a plant but mostly by hand (the port's
# brickworks, the brewhouse, the potbank, the soap boilers, the glasshouse, the paper mill, the lime
# kiln). They are put here, as the brief for this stage says every works that makes a good in a plant
# is; a later reading may move them nearer the hand trades, with more hauling.

[[kind]]
name = "engine and machine works"
tasks = [0.25, 0.50, 0.05, 0.20, 0.0]
methods = ["millwright", "engine_works", "machine_shop", "engineering_works"]
# Unsure: the millwright is a hand trade in 1750 (wood and a few castings, no plant to speak of); it is
# put with the engine works because it makes their good.

[[kind]]
name = "hand trades"
tasks = [0.30, 0.45, 0.0, 0.25, 0.0]
methods = ["smithy", "hand_loom", "saw_pit", "charcoal_burning"]
# Unsure: charcoal burning is woodland work, nearer forestry (.60 .30 0 .10) than the smithy; it is
# a method of the works' table, so it is here.

[[kind]]
name = "builders"
tasks = [0.40, 0.40, 0.02, 0.18, 0.0]
methods = ["masons", "carpenters", "bricklayers", "contract_builders"]

# The content after 1900 (stage 6 of the tree's overlay), each method in a row of its own.
[[kind]]
name = "power stations"
tasks = [0.30, 0.50, 0.05, 0.15, 0.0]
methods = ["coal_power_station"]

[[kind]]
name = "electrical works"
tasks = [0.15, 0.55, 0.05, 0.25, 0.0]
methods = ["electrical_works"]

[[kind]]
name = "oil from coal"
tasks = [0.25, 0.50, 0.05, 0.20, 0.0]
methods = ["oil_from_coal"]

[[kind]]
name = "nitrogen works"
tasks = [0.10, 0.50, 0.05, 0.35, 0.0]
methods = ["nitrogen_works"]

[[kind]]
name = "shops and trades"
tasks = [0.15, 0.25, 0.25, 0.25, 0.10]
methods = ["services", "emporium"]

# ----------------------------------------------------------------------------------------------------
# The land's seven sectors and the carters. Under `tasks.land` a land unit pays its share for work to a
# mixture of hands and machine units, in these classes, wherever a machine below names its sector in
# `on`. With the content after 1900 the tractor names the farms, the pastures and the woods, and the
# cutter the pits; no machine names the carters yet, so their shares wait. The land's machines of
# docs/rules/machines.md (farm machinery, nitrogen, breeding) stand beside these.
# ----------------------------------------------------------------------------------------------------

[[sector]]
names = ["farm"]
tasks = [0.45, 0.40, 0.0, 0.15, 0.0]

[[sector]]
names = ["pasture"]
tasks = [0.30, 0.50, 0.0, 0.20, 0.0]

[[sector]]
names = ["forestry", "quarry", "claypit", "ironmine", "coalmine"]
tasks = [0.60, 0.30, 0.0, 0.10, 0.0]

[[sector]]
names = ["carting"]
tasks = [0.70, 0.20, 0.0, 0.10, 0.0]

# ----------------------------------------------------------------------------------------------------
# Machines for tasks. Each `[[use]]` is one machine:
#   class           the class it works in; it may hold the tasks from `from` to `reach` of it
#   on              where it is used: "works", and the land's sectors it reaches by name ("carting" is
#                   read and passed over: no machine reaches the carters yet)
#   plant, run      goods bought once for one machine, and goods a month to keep one working
#   minders         worker-months a month of minding one machine
#   life            years a machine stands: a twelfth of this many years' part wears out a month
#   pace, cap       quality grows by `pace` a year from the year found, up to `cap`
#   found_after     nothing is found before this year
#   discover        the island finds it at the first year's turn (from `found_after`) when it has made
#                   at least this much of each good named, counted from 1750
#   scale           one number, multiplying everything one machine takes (plant, run and minders),
#                   refitted once in its first sweep so that it takes its first share when found
#   replaces        (may be left out) the name of another use: where this one is laid, that one no
#                   longer reaches the places this one is `on`
#
# A use that names a good the content lacks (a good of a later stage of the tree's overlay) is not laid,
# as the overlay drops an input of a later stage, and replaces nothing; so the electric drive and the
# cutter, made of electrical goods and run on electricity, and the tractor, run on oil, are in the table
# only with `tree.stage` at 6 or more, and where they are not the hoist keeps the works and the pits.
# ----------------------------------------------------------------------------------------------------

# The hoist: a STAND-IN, poor history and a fair test. It is made of machinery and burns coal, so it could
# be proved on the island before there was anything after 1900 in the content. It hauls in the works and,
# under `tasks.land`, at the quarries, the clay pits and the mines: winding, hauling underground, lifting
# stone and clay. Where the content after 1900 is laid (stage 6 of the tree, the game's own) the electric
# drive takes the works from it and the cutter below the pits, so it hauls nowhere. It stays in this file
# as the machine of the island without the content after 1900, so that the run at `tree.stage = 1` is the
# earlier island's to the byte.
#
# Sized from island 7's prices and wage of 1900 under the game's rules with six families (wage 8.18 a
# month, machinery 4.40, coal 0.494): when found, a unit costs 1.04 of a month's wage, of which six
# tenths is the return a works must see and the wear on its plant ((0.12 + 1/20) / 12 a month on 44
# months' wages, 82 machinery), a tenth is its minders (0.104 of a hand) and the rest is coal (5.2 a
# month). At that cost a hand is worth 0.96 units, so the hoist takes the hauling where a hand is worth
# fewer: ln(0.96 / 0.3) / ln(100 / 0.3) = 0.20 of the class.
#
# The threshold: island 7 has made 4.07 million units of machinery by the end of 1901 and 4.18 million
# by the end of 1902 (from the owners' sweep), so it finds the hoist in 1903. Islands 1, 2, 5, 6 and 8
# have made more than that by 1900 and find it in 1901; islands 3 and 4 some years later.
[[use]]
name = "hoist"
class = "haul"
on = ["works", "quarry", "claypit", "ironmine", "coalmine"]
from = 0.0
reach = 1.0
plant = { machinery = 82.0 }
run = { coal = 5.2 }
minders = 0.104
life = 20.0
pace = 0.03
cap = 8.0
found_after = 1901
discover = { machinery = 4100000.0 }
# Refitted once (19 November 2026): at 1.0 the towns' target in the year found was 0.223 on the mean of
# islands 1 to 8 (0.196 to 0.244; found 1901 on five islands, 1903 on island 7, 1907 on islands 3 and 4),
# so the unit was made exp(ln(100 / 0.3) * (0.223 - 0.2)) = 1.14 times as dear, to bring the mean to 0.20.
scale = 1.14

# The electric drive: the first machine of the design itself, no longer a stand-in. Motors on the line
# shafts and the cranes, made of machinery and electrical goods and run on electricity; it hauls in the
# works. Electricity goes no further than a town's own wires, so a works in a town with no station sees it
# at its ceiling price, and there the drive holds nothing.
#
# Sized from island 7 in 1894, the year it finds the drive at the threshold below, in town 7, the only
# town on the island with a station working that year (the island's mean price of electricity, 73.3, is
# the ceiling in every other town): a wage of 8.41 a month, machinery 3.25, electrical goods 30.1 and
# electricity 2.59, the year's means. When found a unit costs 1.04 of a month's wage (8.75), of which six
# tenths is the return a works must see and the wear on its plant ((0.12 + 1/20) / 12 a month on 370 of
# plant, 44 months' wages: six tenths of it machinery, 68.5, and four tenths electrical goods, 4.92), a
# tenth its minders (0.104 of a hand) and the rest electricity (1.01 a month). At that cost a hand is
# worth 0.96 units, which takes ln(0.96 / 0.3) / ln(100 / 0.3) = 0.20 of hauling.
#
# The threshold: island 7 has made 13,172 electrical goods by the end of 1892 and 20,189 by the end of
# 1893, so at 15,000 it finds the drive in 1894. On the islands of stage 6 as they were before the drive,
# islands 1 and 5 have made that much by 1889, island 6 by 1890, island 7 by 1893, islands 2 and 8 by
# 1896, island 3 by 1898, and island 4, whose first electrical works comes late, about 1921.
#
# Found from 1901, not 1890 (docs/rules/tasks.md, "The standing check"): from 1890 the drive was found on
# seven islands before 1900 and moved the played century, so that two of the twelve facts of the standing
# check left the spread of seeds (the towns' share and land's share of income in 1900). So no island
# finds it before 1901: islands 1, 2, 3, 5, 6, 7 and 8 find it in 1901, island 4 about 1922.
[[use]]
name = "electric_drive"
class = "haul"
on = ["works"]
from = 0.0
reach = 1.0
plant = { machinery = 68.5, electricals = 4.92 }
run = { electricity = 1.01 }
minders = 0.104
life = 20.0
pace = 0.03
cap = 8.0
found_after = 1901
discover = { electricals = 15000.0 }
# Refitted (19 November 2026). The towns' target in the year found reads nothing on an island with no
# station that year (half the islands find the drive before their first), so the refit reads what the
# towns that can run it give it: from the first year in which those towns do three quarters of the works'
# hauling, the mean of the five years after, each taken back to a quality of one
# (`use_share_run_electric_drive`). Found from 1890, at 1.0 that was 0.161 on the mean of islands 1 to 8
# (0.146 to 0.172): the stations' electricity, at 3 to 4.5 a unit once they are settled, is dearer than
# town 7's in 1894; so 0.80. Found from 1901, at 0.80 it was 0.194 (0.134 to 0.222), so the unit was made
# exp(ln(100 / 0.3) * (0.194 - 0.2)) = 0.97 times as dear again, 0.77 in all, to bring the mean to 0.20.
# On the three islands with a station working in the year found (1, 5 and 7) the towns' target that year
# was 0.220, 0.201 and 0.204 at 0.80.
scale = 0.77
replaces = "hoist"

# The tractor: hauling on the farms, the pastures and the woods (ploughing, carting the crop, dragging
# timber), from the content after 1900 (`tree.stage` 6). It is made of machinery and steel, six tenths
# and four tenths by value (motor vehicles are a later stage's good; when they come its plant moves to
# them), and it runs on oil. The island has no oilfield, so its oil is made from coal at about three
# times the price of the same heat from coal, and the tractor is found on oil made, not on a date: an
# island with no oil of its own mechanises its fields late.
#
# PROVISIONAL: sized below from a first run.
[[use]]
name = "tractor"
class = "haul"
on = ["farm", "pasture", "forestry"]
from = 0.0
reach = 1.0
plant = { machinery = 54.2, steel = 41.7 }
run = { oil = 0.36 }
minders = 0.117
life = 10.0
pace = 0.04
cap = 6.0
found_after = 1915
discover = { oil = 300.0 }
scale = 0.87

# The cutter and conveyor: hauling at the quarries, the clay pits and the mines (cutting the face,
# carrying it out, winding), from the content after 1900. Made of machinery and electrical goods, six
# tenths and four tenths by value, and run on electricity. It takes the hoist's place in the pits.
#
# PROVISIONAL: sized below from a first run.
[[use]]
name = "cutter"
class = "haul"
on = ["quarry", "claypit", "ironmine", "coalmine"]
from = 0.0
reach = 1.0
plant = { machinery = 87.7, electricals = 11.0 }
run = { electricity = 1.10 }
minders = 0.104
life = 15.0
pace = 0.03
cap = 6.0
found_after = 1920
discover = { electricals = 600000.0 }
scale = 1.0
replaces = "hoist"
