# Knowledge that changes how existing activities work rather than adding firms.
[[tech]]
name = "steam_pumping"
label = "Steam pumping"
known = true
headline = "Steam engines drain the pits at {town}"
story = "Engines pump water from the workings around {town}. The miners can go deeper than ever."

[[tech]]
name = "wagonway"
label = "Iron wagonways"
known = true
headline = "Iron wagonways at {town}"
story = "The pits around {town} lay iron rails so one horse can haul what four did."

