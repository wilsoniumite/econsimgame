# Isolated State content: everything the economy is made of.
#
# Units: quantities are "units" of a good, time is one month, labor is
# worker-months. Prices are in an arbitrary money unit (grain starts near 1).
# Transport bulk ("weight") multiplies freight cost per unit of path cost.

[meta]
start_year = 1750
end_year = 1900

goods = [
  { name = "grain",    label = "Grain",     weight = 1.0, price = 1.0,  color = "#d6b85a" },
  { name = "wool",     label = "Wool",      weight = 0.6, price = 1.5,  color = "#e8e1cf" },
  { name = "timber",   label = "Timber",    weight = 1.6, price = 0.8,  color = "#7a5a32" },
  { name = "stone",    label = "Stone",     weight = 2.2, price = 0.6,  color = "#9a9590" },
  { name = "clay",     label = "Clay",      weight = 2.0, price = 0.4,  color = "#c08a5a" },
  { name = "iron_ore", label = "Iron ore",  weight = 1.8, price = 0.8,  color = "#8e4a34" },
  { name = "coal",     label = "Coal",      weight = 1.6, price = 0.9,  color = "#2e2b28" },
  { name = "charcoal", label = "Charcoal",  weight = 0.9, price = 2.4,  color = "#4a4038" },
  { name = "iron",     label = "Iron",      weight = 1.0, price = 6.0,  color = "#5b6670" },
  { name = "steel",    label = "Steel",     weight = 1.0, price = 30.0, color = "#3d5a73" },
  { name = "tools",    label = "Tools",     weight = 0.4, price = 8.0,  color = "#6e5b45" },
  { name = "cloth",    label = "Cloth",     weight = 0.3, price = 5.0,  color = "#a8476b" },
  { name = "bricks",   label = "Bricks",    weight = 1.6, price = 1.8,  color = "#a4492f" },
  { name = "machinery",label = "Machinery", weight = 1.2, price = 70.0, color = "#2f4b3c" },
  { name = "rails",    label = "Rails",     weight = 1.3, price = 18.0, color = "#4b4b55" },
  { name = "services", label = "Services",  weight = 4.0, price = 3.0,  color = "#8a6fa8" },
]

# Households buy *services*. Any good with a property for a service can supply
# it, so iron can be used as a (bad) tool and wool spun at home is (bad) cloth.
# Services are bought from the cheapest suppliers via a logit mix.
[services]
names = ["food", "warmth", "shelter", "clothing", "implements", "comfort"]
labels = ["Food", "Warmth", "Shelter", "Clothing", "Implements", "Comfort"]
subsistence = [1.0, 0.25, 0.06, 0.03, 0.002, 0.0]   # per capita per month
shares = [0.28, 0.14, 0.22, 0.19, 0.07, 0.10]       # marginal budget shares above subsistence
lord_shares = [0.04, 0.08, 0.30, 0.22, 0.08, 0.28]  # landlords spend on comfort, not bread

[services.props]
grain = { food = 1.0 }
timber = { warmth = 1.0, shelter = 0.6 }
charcoal = { warmth = 1.8 }
coal = { warmth = 2.4 }
stone = { shelter = 0.5 }
bricks = { shelter = 1.0 }
wool = { clothing = 0.35 }
cloth = { clothing = 1.0 }
iron = { implements = 0.35 }
steel = { implements = 3.0 }
tools = { implements = 1.0 }
machinery = { implements = 3.0 }
services = { comfort = 1.0 }

# Heat value of fuels, used both by households (warmth) and industry (heat input).
[heat]
timber = 1.0
charcoal = 1.8
coal = 2.4

# Land-based sectors. Each cell runs Cobb-Douglas Y = A * f * L^(1-alpha) where
# f is the cell's resource field. Land rent is the alpha share.
[[sector]]
name = "farm"
label = "Farmland"
good = "grain"
alpha = 0.28
A = 22.0
field = "fertility"

[[sector]]
name = "pasture"
label = "Pasture"
good = "wool"
alpha = 0.4
A = 7.0
field = "pasture"

[[sector]]
name = "forestry"
label = "Woodland"
good = "timber"
alpha = 0.3
A = 14.0
field = "forest"

[[sector]]
name = "quarry"
label = "Quarry"
good = "stone"
alpha = 0.25
A = 20.0
field = "rock"

[[sector]]
name = "claypit"
label = "Clay pit"
good = "clay"
alpha = 0.25
A = 20.0
field = "clay"

[[sector]]
name = "ironmine"
label = "Iron mine"
good = "iron_ore"
alpha = 0.3
A = 18.0
field = "ore"
mine = true

[[sector]]
name = "coalmine"
label = "Colliery"
good = "coal"
alpha = 0.3
A = 28.0
field = "coal"
mine = true

# Firm methods: Leontief recipes run by firms placed on the map.
# inputs: goods per unit output; heat: heat units per unit output;
# labor: worker-months per unit output; capital: goods per unit of monthly capacity.
# K0: scale at which the method is reasonably efficient (smaller is allowed, just worse).
# A0, Q0, b: learning curve A = A0 * (1 + Q/Q0)^b on cumulative output Q.
# discover: cumulative production of goods needed before the method can be found.
[[method]]
name = "charcoal_burning"
label = "Charcoal burning"
output = "charcoal"
inputs = { timber = 2.0 }
heat = 0.0
labor = 0.3
capital = { timber = 30 }
K0 = 20.0
known = true

[[method]]
name = "bloomery"
label = "Bloomery"
output = "iron"
inputs = { iron_ore = 2.5, charcoal = 2.5 }
heat = 0.0
labor = 1.2
capital = { stone = 60, clay = 30 }
K0 = 3.0
known = true

[[method]]
name = "charcoal_furnace"
label = "Charcoal blast furnace"
output = "iron"
inputs = { iron_ore = 2.0, charcoal = 2.0 }
heat = 0.0
labor = 0.4
capital = { stone = 80, bricks = 40 }
K0 = 20.0
known = true

[[method]]
name = "coke_furnace"
label = "Coke blast furnace"
output = "iron"
inputs = { iron_ore = 2.0, coal = 2.3 }
heat = 0.0
labor = 0.35
capital = { stone = 80, bricks = 55 }
K0 = 40.0
known = false
A0 = 0.55
Q0 = 2000.0
b = 0.45
discover = { coal = "x35", iron = "x30" }
headline = "Iron smelted with coke at {town}"
story = "{who} fires a blast furnace with coked coal instead of charcoal. The first iron is brittle, but coal is cheap and the forests are not."

[[method]]
