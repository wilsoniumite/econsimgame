# Overrides the base entry: only these fields change.
# The plant and the steel threshold are what the game's machines rule already gives it; they are written out
# here so that the overlay is the one place the game's content is said. The machinery threshold is new (the
# machines rule has 90,000): the machine-tool works triples the machinery made, and with 90,000 the
# converter was found fifteen years early.
# At base prices, with the change: sells 30.00; inputs 6.90, heat 0.23, labour 1.25; cost 8.38; margin
# +21.62 (72%); plant 123.0, 4.1 months of output.
[[method]]
name = "bessemer"
capital = { bricks = 45, machinery = 0.6 }
discover = { steel = 2800000.0, machinery = 250000.0, iron = "x220" }
target = 1856
