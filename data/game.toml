# Isolated State: the game's production tree, as an overlay on data/content.toml.
#
# content.toml is the Python's file and stays as it is. A game loads it and then lays this file over
# it (crates/isostate-core/src/tree.rs; docs/rules/tree.md says what a run of it showed):
#   - an entry ([[method]], [[sector]], [[tech]], a good, a row of [services.props]) whose name the
#     content already has changes it key by key: only the keys written here change, and a table
#     written here (inputs, capital, discover) replaces the content's table whole;
#   - a new name is added after the content's own, so the port's goods and methods keep their places;
#   - the lists of [services] replace the content's lists; a row of [services.props] adds to or
#     changes the needs it names and leaves the good's other needs alone.
#
# Every entry carries `stage` (one without it is of stage 1), and the stages are numbered in the order
# they are built, so a ceiling is enough: P.tree.stage = N keeps the entries with stage <= N. A good
# of a later stage does not exist, and any input, capital line, threshold or row of props that names
# it is dropped. This file holds stage 1. The stages after it are designed in
# docs/designs/production-tree.md and written out in docs/designs/production-tree-draft.toml; each
# waits for an engine change (sites, foreign trade, improvements as data, fleets) and joins this file
# when that change is built.
#
# Keys the port's file does not use:
#   goods:    decay (monthly loss of stock), stock0 (opening stock a head; also the opening guess of a
#             month's trade), traded (false: made where it is used and not carried between towns)
#   services: theta (the logit's width within each need; the port has 0.25 for all)
#   method:   group (the family trade, one of iron, textiles, coal, engineering, building, estates:
#             without it no family can own the works), seed (opened in 1750 where its good is wanted),
#             target (the year an invention is aimed at: read by the example that reports a run, not
#             by the engine), site (where it must stand: read from stage 2, ignored until then)
#
# The comment above each method gives its unit sums at base prices as the designers reckoned them:
# what a unit sells for, what its inputs, heat (0.376 a unit at base prices, nearly all coal) and
# labour (at a wage of 2.5) cost on the recipe as written, the margin, and the plant. Where a number
# was changed after the tree was first run, the comment says "RUN:" and why.
#
# Steel stays at 3.0 as an implement: at 1.6 no steel is ever sold under the game's rules, the
# converter is never found and the land's machines never improve. Raw shelter IS re-rated here, for
# the game only (stone 0.3, bricks 0.6, timber 0.4): without it builders lose shelter back to heaped
# stone and kiln brick as wages rise.

[meta]
goods = [
  { name = "building", label = "Building work", weight = 12.0, price = 2.2, color = "#b08d6a", decay = 0.1, stock0 = 0.09, traded = false, stage = 1 },
  { name = "lumber", label = "Sawn timber", weight = 1.2, price = 2.2, color = "#b98d54", decay = 0.004, stock0 = 0.02, stage = 1 },
  { name = "lime", label = "Lime and cement", weight = 1.5, price = 2.0, color = "#e2ddd0", decay = 0.01, stock0 = 0.03, stage = 1 },
  { name = "beer", label = "Beer", weight = 2.0, price = 2.0, color = "#b8742a", decay = 0.06, stock0 = 0.07, stage = 1 },
  { name = "pottery", label = "Pottery", weight = 1.0, price = 3.4, color = "#c9b08a", decay = 0.003, stock0 = 0.01, stage = 1 },
  { name = "gas", label = "Town gas", weight = 20.0, price = 2.4, color = "#e6c94f", decay = 0.15, stock0 = 0.0, traded = false, stage = 1 },
  { name = "chemicals", label = "Soap and chemicals", weight = 0.9, price = 4.5, color = "#c9c23a", decay = 0.003, stock0 = 0.006, stage = 1 },
  { name = "glass", label = "Glass", weight = 1.0, price = 9.0, color = "#9fd0c8", decay = 0.003, stock0 = 0.003, stage = 1 },
  { name = "paper", label = "Paper", weight = 0.5, price = 4.6, color = "#f2ecd9", decay = 0.004, stock0 = 0.004, stage = 1 },
]
# The sixteen goods of the port take decay and stock0 from the tables they have always been in
# (P.decay in params.rs, `guess` in sim.rs). Building work and town gas are not carried between
# towns: a house is built where it stands, and gas goes as far as its pipes.

[services]
# Two needs are added. "warmth" keeps its name and is shown as "Fuel and light": gas sells into it, and
# after 1900 so will whatever a household burns or switches on.
names = ["food", "warmth", "shelter", "clothing", "implements", "comfort", "table", "wares"]
labels = ["Food", "Fuel and light", "Shelter", "Clothing", "Implements", "Comfort", "Drink and groceries", "Household goods"]
subsistence = [1.0, 0.25, 0.06, 0.03, 0.002, 0.0, 0.0, 0.0]   # per head per month; unchanged, none for the new needs
shares = [0.25, 0.13, 0.2, 0.17, 0.07, 0.09, 0.06, 0.03]        # at subsistence and a bit (the port: 0.28, 0.14, 0.22, 0.19, 0.07, 0.10)
shares_rich = [0.05, 0.06, 0.2, 0.17, 0.07, 0.28, 0.07, 0.1]   # far above it, for the Engel rule (its own six: 0.05, 0.06, 0.24, 0.22, 0.07, 0.36)
lord_shares = [0.03, 0.07, 0.28, 0.19, 0.07, 0.24, 0.04, 0.08]   # (the port: 0.04, 0.08, 0.30, 0.22, 0.08, 0.28)
theta = [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 2.0]   # household goods are unlike each other: at 2.0 each keeps its share of the money

[services.props]
building = { shelter = 3.0 }   # stone, brick and timber put up by men who know how
stone = { shelter = 0.3 }   # re-rated for the game (the port has 0.5): a household that heaps up its own wall gets a hovel
bricks = { shelter = 0.6 }   # re-rated (the port has 1.0)
timber = { shelter = 0.4, wares = 0.1 }   # shelter: re-rated (the port has 0.6); wares: treen: bowls and spoons whittled at home
lumber = { shelter = 0.6, wares = 0.35 }   # shelter: boards for a man who builds for himself; wares: plain furniture
lime = { shelter = 0.5 }   # limewash and plaster
grain = { table = 0.15 }   # home brewing
beer = { table = 1.0 }
pottery = { wares = 1.0 }
gas = { warmth = 4.5 }   # light is worth more than heat: the number gas's whole trade hangs on
chemicals = { wares = 1.3 }   # soap, candles and washing soda
glass = { wares = 2.5 }   # bottles, tableware and the window pane
paper = { wares = 1.3 }

[heat]
# Unchanged: none of the new goods is burnt for heat in a works. Gas warms and lights houses only.

