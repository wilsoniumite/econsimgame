label = "Electrical works"
output = "electricals"
inputs = { steel = 0.25, chemicals = 0.1, glass = 0.05 }
heat = 1.0
labor = 0.45
capital = { building = 13.7, steel = 0.34, machinery = 0.86 }
K0 = 40.0
