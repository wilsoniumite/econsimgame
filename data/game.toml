# Isolated State: the game's production tree, as an overlay on data/content.toml.
#
# content.toml is the Python's file and stays as it is. A game loads it and then lays this file over
# it (crates/isostate-core/src/tree.rs; docs/rules/tree.md says what a run of it showed):
#   - an entry ([[method]], [[sector]], [[tech]], a good, a row of [services.props]) whose name the
#     content already has changes it key by key: only the keys written here change, and a table
#     written here (inputs, capital, discover) replaces the content's table whole;
#   - a new name is added after the content's own, so the port's goods and methods keep their places;
#   - the lists of [services] replace the content's lists; a row of [services.props] adds to or
#     changes the needs it names and leaves the good's other needs alone.
#
# Every entry carries `stage` (one without it is of stage 1), and the stages are numbered in the order
# they are built, so a ceiling is enough: P.tree.stage = N keeps the entries with stage <= N. A good
# of a later stage does not exist, and any input, capital line, threshold or row of props that names
# it is dropped. This file holds stage 1, and stage 6, the first content after 1900 (electricity and
# electrical goods: docs/rules/tree.md, "After 1900: electricity"). The content after 1900 is numbered on
# from the tree's own five stages so that the ceiling still works; stages 2 to 5 are designed in
# docs/designs/production-tree.md and written out in docs/designs/production-tree-draft.toml; each
# waits for an engine change (sites, foreign trade, improvements as data, fleets) and joins this file
# when that change is built. Until then stage 6 lays stage 1 and its own entries, and nothing else.
#
# Keys the port's file does not use:
#   goods:    decay (monthly loss of stock), stock0 (opening stock a head; also the opening guess of a
#             month's trade), traded (false: made where it is used and not carried between towns),
#             stock_months (the months of sales merchants mean to hold; absent is the island's
#             price_target_months, 2; 0 is a good that does not keep: what is not sold in a month is lost
#             at its end, and its price moves on the month's asking against its making), opens_dear (true:
#             the good opens at its ceiling price in every town, for a good nobody has until it is found)
#   services: theta (the logit's width within each need; the port has 0.25 for all)
#   method:   group (the family trade, one of iron, textiles, coal, engineering, building, estates:
#             without it no family can own the works), seed (opened in 1750 where its good is wanted),
#             target (the year an invention is aimed at: read by the example that reports a run, not
#             by the engine), site (where it must stand: read from stage 2, ignored until then)
#
# The comment above each method gives its unit sums at base prices as the designers reckoned them:
# what a unit sells for, what its inputs, heat (0.376 a unit at base prices, nearly all coal) and
# labour (at a wage of 2.5) cost on the recipe as written, the margin, and the plant. Where a number
# was changed after the tree was first run, the comment says "RUN:" and why.
#
# The thresholds (`discover`) are the exception: they are plain numbers of units, right for one
# island and one set of rules, and they are not set by hand. crates/isostate-core/parity/tree_fit.py
# fits them to a sweep so that each invention is found, on average, in the year its `target` says
# (docs/rules/tree.md, "The fitter"). These were fitted in three passes after the mines were merged,
# which made ore a third cheaper and brought everything on iron and steel some ten years early, and
# fitted again in two passes on 19 November 2026, on the island stages 2 to 5 of the pass over the
# rules leave (docs/rules/tree.md, "On the island stage 5 leaves"). When the island or the rules
# change again (the freight by the wage, another generator), fit them again.
#
# Steel stays at 3.0 as an implement: at 1.6 no steel is ever sold under the game's rules, the
# converter is never found and the land's machines never improve. Raw shelter IS re-rated here, for
# the game only (stone 0.25, bricks 0.5, timber 0.4): without it builders lose shelter back to heaped
# stone and kiln brick as wages rise.

[meta]
goods = [
  { name = "building", label = "Building work", weight = 12.0, price = 2.2, color = "#b08d6a", decay = 0.1, stock0 = 0.09, traded = false, stage = 1 },
  { name = "lumber", label = "Sawn timber", weight = 1.2, price = 2.2, color = "#b98d54", decay = 0.004, stock0 = 0.02, stage = 1 },
  { name = "lime", label = "Lime and cement", weight = 1.5, price = 2.0, color = "#e2ddd0", decay = 0.01, stock0 = 0.03, stage = 1 },
  { name = "beer", label = "Beer", weight = 2.0, price = 2.0, color = "#b8742a", decay = 0.06, stock0 = 0.07, stage = 1 },
  { name = "pottery", label = "Pottery", weight = 1.0, price = 3.4, color = "#c9b08a", decay = 0.003, stock0 = 0.01, stage = 1 },
  { name = "gas", label = "Town gas", weight = 20.0, price = 2.4, color = "#e6c94f", decay = 0.15, stock0 = 0.0, traded = false, stage = 1 },
  { name = "chemicals", label = "Soap and chemicals", weight = 0.9, price = 4.5, color = "#c9c23a", decay = 0.003, stock0 = 0.006, stage = 1 },
  { name = "glass", label = "Glass", weight = 1.0, price = 9.0, color = "#9fd0c8", decay = 0.003, stock0 = 0.003, stage = 1 },
  { name = "paper", label = "Paper", weight = 0.5, price = 4.6, color = "#f2ecd9", decay = 0.004, stock0 = 0.004, stage = 1 },
  { name = "electricity", label = "Electricity", weight = 20.0, price = 1.2, color = "#8cc4ea", stock0 = 0.0, traded = false, stock_months = 0.0, opens_dear = true, stage = 6 },
  { name = "electricals", label = "Electrical goods", weight = 0.5, price = 7.0, color = "#b8733b", decay = 0.003, stock0 = 0.0, opens_dear = true, stage = 6 },
  { name = "oil", label = "Oil", weight = 1.0, price = 1.0, color = "#5a4a2e", decay = 0.002, stock0 = 0.0, opens_dear = true, stage = 6 },
  { name = "fertiliser", label = "Fertiliser", weight = 1.0, price = 1.0, color = "#9fb86a", decay = 0.002, stock0 = 0.0, opens_dear = true, stage = 6 },
]
# The sixteen goods of the port take decay and stock0 from the tables they have always been in
# (P.decay in params.rs, `guess` in sim.rs). Building work and town gas are not carried between
# towns: a house is built where it stands, and gas goes as far as its pipes.
# Stage 6, after 1900 (docs/rules/tree.md, "After 1900: electricity"): electricity goes as far as its wires,
# and there is no grid between towns yet, so every town that wants it builds its own station. It does not
# keep (`stock_months = 0`): what is made and not sold in a month is lost at its end. Both new goods open
# at their ceiling price (`opens_dear`): nobody has them for more than a century, and at their base prices
# they are the cheapest fuel and the cheapest household good on the island.
# Oil (stage 6, the land's twentieth century: docs/rules/tree.md, "Oil, nitrogen and the land"): the
# island has no oilfield, so its oil is made from coal. It keeps, and it opens at its ceiling price as
# electricity does: at its base price of 1 it would be the cheapest warmth on the island in 1750, a good
# nobody has until oil is made from coal.
# Fertiliser (stage 6, the land's twentieth century: docs/rules/tree.md, "Oil, nitrogen and the land"):
# nitrogen fixed from the air, which only the nitrogen works make and only the farms that keep nitrogen
# buy. It keeps, and it opens at its ceiling price, as oil does: nobody has it until a works makes it.

[services]
# Two needs are added. "warmth" keeps its name and is shown as "Fuel and light": gas sells into it, and
# after 1900 so will whatever a household burns or switches on.
names = ["food", "warmth", "shelter", "clothing", "implements", "comfort", "table", "wares"]
labels = ["Food", "Fuel and light", "Shelter", "Clothing", "Implements", "Comfort", "Drink and groceries", "Household goods"]
subsistence = [1.0, 0.25, 0.06, 0.03, 0.002, 0.0, 0.0, 0.0]   # per head per month; unchanged, none for the new needs
shares = [0.25, 0.13, 0.2, 0.17, 0.07, 0.09, 0.06, 0.03]        # at subsistence and a bit (the port: 0.28, 0.14, 0.22, 0.19, 0.07, 0.10)
shares_rich = [0.05, 0.06, 0.2, 0.17, 0.07, 0.28, 0.07, 0.1]   # far above it, for the Engel rule (its own six: 0.05, 0.06, 0.24, 0.22, 0.07, 0.36)
lord_shares = [0.03, 0.07, 0.28, 0.19, 0.07, 0.24, 0.04, 0.08]   # (the port: 0.04, 0.08, 0.30, 0.22, 0.08, 0.28)
theta = [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 2.0]   # household goods are unlike each other: at 2.0 each keeps its share of the money

[services.props]
building = { shelter = 3.0 }   # stone, brick and timber put up by men who know how
stone = { shelter = 0.25 }   # re-rated for the game (the port has 0.5): a household that heaps up its own wall gets a hovel
bricks = { shelter = 0.5 }   # re-rated (the port has 1.0)
# RUN: the draft had stone 0.3 and bricks 0.6. With those the builders held nine tenths of shelter to 1850
# and three quarters in 1900, when kiln brick and machine-dug stone are cheapest; at 0.25 and 0.5 they
# hold it all century.
timber = { shelter = 0.4, wares = 0.1 }   # shelter: re-rated (the port has 0.6); wares: treen: bowls and spoons whittled at home
lumber = { shelter = 0.6, wares = 0.35 }   # shelter: boards for a man who builds for himself; wares: plain furniture
lime = { shelter = 0.5 }   # limewash and plaster
grain = { table = 0.15 }   # home brewing
beer = { table = 1.0 }
pottery = { wares = 1.0 }
gas = { warmth = 4.5 }   # light is worth more than heat: the number gas's whole trade hangs on
chemicals = { wares = 1.3 }   # soap, candles and washing soda
glass = { wares = 2.5 }   # bottles, tableware and the window pane
paper = { wares = 1.3 }
# stage 6. Light is worth more than heat, as it is for gas (4.5); electrical goods are lamps, bells, irons
# and the first wireless sets, five times what a unit of pottery serves.
# RUN: the design's first value for electricity was 9. On islands 1 to 8 to 2050 it gave electricity 0.090
# of fuel and light in 1930 (0.034 to 0.191 by island), under the tenth the design's pass allows, with a
# unit of warmth from it about half as dear again as one from coal. Refitted once, to 11, a fifth more,
# which by the logit's width of 0.25 brings the mean in 1930 to about a fifth. Heat (5) was left: a tenth of
# a per cent to two per cent of the works' heat to 1930, far inside its bound of a half by 1910.
electricity = { warmth = 11.0 }
electricals = { wares = 5.0 }
oil = { warmth = 3.5 }   # stage 6: lamp oil and paraffin; the travel it serves is a later stage's

[heat]
# None of stage 1's goods is burnt for heat in a works: gas warms and lights houses only. Electricity
# (stage 6) is a fuel a works may take: at 5 a unit, where coal gives 2.4, it carries the 1.1 of coal its
# station burns at about twice the heat, and it pays for that in hands and plant.
electricity = 5.0
# Oil (stage 6) burns at 3.5, a half again of coal's 2.4; made from coal, it costs several times as much
# for the same heat, so a works takes little of it.
oil = 3.5

# ====================================================================================================
# The port's methods that the game changes.
# ====================================================================================================

# Overrides the base entry: only these fields change.
# A larger usual size (the port's is 5). A new works is 0.4 K0, and under the life cycle a trade too small
# for its market grows by one such works a year; the three larger sizes here were in every run of this
# content under the game's rules.
# At base prices, with the change: sells 8.00; inputs 3.30, heat 0.23, labour 2.50; cost 6.03; margin +1.97
# (25%); plant 24.0, 3.0 months of output.
[[method]]
name = "smithy"
K0 = 10.0
stage = 1

# Overrides the base entry: only these fields change.
# A larger usual size (the port's is 4), for the same reason as the smithy's.
# At base prices, with the change: sells 30.00; inputs 7.92, heat 1.13, labour 10.00; cost 19.05; margin
# +10.95 (37%); plant 60.0, 2.0 months of output.
[[method]]
name = "crucible_steel"
K0 = 10.0
stage = 1

# Overrides the base entry: only these fields change.
# A larger usual size (the port's is 3), for the same reason as the smithy's: machinery is the thinnest
# market on the island and the one every later works waits on.
# At base prices, with the change: sells 70.00; inputs 21.20, heat 0.75, labour 15.00; cost 36.95; margin
# +33.05 (47%); plant 466.0, 6.7 months of output.
# RUN: the draft had 8. Under the works' life cycle a first works is a tenth of its town's trade, one or
# two units of machinery a month, and a works that far under its usual size pays a penalty in hands and
# materials: at 8 the engine works was never built in three seeds of eight, at 4 in one.
[[method]]
name = "engine_works"
K0 = 4.0
stage = 1

# Overrides the base entry: only these fields change.
# The plant and the steel threshold are what the game's machines rule already gives it; they are written out
# here so that the overlay is the one place the game's content is said. The thresholds are the fitter's (the
# machines rule has 2,800,000 of steel and 90,000 of machinery): the machine-tool works triples the
# machinery made, and with 90,000 the converter was found fifteen years early.
# At base prices, with the change: sells 30.00; inputs 6.90, heat 0.23, labour 1.25; cost 8.38; margin
# +21.62 (72%); plant 123.0, 4.1 months of output.
[[method]]
name = "bessemer"
capital = { bricks = 45, machinery = 0.6 }
discover = { steel = 3800000.0, machinery = 430000.0, iron = "x220" }
target = 1856
stage = 1

# Overrides the base entry: only these fields change.
# Steel per rail and plant as the game's machines rule has them (a steel rail stands in for three iron
# ones); thresholds moved with the steel and machinery this content makes. It is found on time and hardly
# built: rails rolled from hot-blast iron are too cheap. It waits for railways that wear out (stage 6).
# At base prices, with the change: sells 18.00; inputs 10.50, heat 0.23, labour 1.75; cost 12.48; margin
# +5.52 (31%); plant 96.3, 5.3 months of output.
[[method]]
name = "steel_rolling"
inputs = { steel = 0.35 }
capital = { bricks = 36, machinery = 0.45 }
discover = { steel = 4800000.0, rails = 630000.0, machinery = 840000.0 }
target = 1866
stage = 1

# At base prices: sells 2.20; inputs 1.14, heat 0.00, labour 0.62 (0.25 at a wage of 2.5); cost 1.77; margin
# +0.44 (20%).
# Plant 2.8 a unit of monthly capacity, 1.3 months of output; about 135 hands at K0.
# The lime is a tenth of a unit: one kiln serves a town, and the opening stock covers the months before the
# first kiln burns.
# RUN: the draft had timber 0.35 and no sawn timber. In runs the masons are nine tenths of all building
# until the contract builders come (the timber-frame builders and bricklayers, who were to buy the sawn
# timber, are a hundredth of it), so sawn timber had a tenth of the market reckoned for it and the steam
# sawmill was found in three seeds of eight, forty years late. The masons' floors and roofs are now sawn
# timber: 0.2 of it is 0.28 of timber through a saw pit, a little less than the draft's 0.35.
[[method]]
name = "masons"
label = "Masons and carpenters"
output = "building"
inputs = { stone = 1.1, lumber = 0.2, lime = 0.1 }
heat = 0.0
labor = 0.25
capital = { timber = 3, tools = 0.05 }
K0 = 300.0
known = true
seed = true
group = "building"
stage = 1

