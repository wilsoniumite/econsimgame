# At base prices: sells 1.20; inputs 0.99 (coal 1.1), heat 0.00, labour 0.25 (0.1 at a wage of 2.5); cost
# 1.24; margin -0.04 (-3%). At the island's prices of 1888 (coal 0.459, wage 8.61, as above): inputs 0.50,
# labour 0.86, cost 1.37; at warmth's parity with coal (9 / 2.4 of coal's price, 1.72) a margin of +0.35
# (20%), and it is the plant that decides it.
# Plant 72.2 a unit of monthly capacity at base prices (5 years of output: building 21.6, steel 7.2,
# machinery 43.4); at 1888's prices 34.8, 29 months of output. About 150 hands at K0.
# K0 on the gasworks' pattern, which is sized to the town it lights since gas cannot be carted: a middling
# town of 1900 (some 25,000 people) takes about three units of fuel and light a head a month, and a fifth
# of that at 9 to the unit is some 1,700 units of electricity; 1,500. A first station, at 0.4 of it, is
# then a third of what its town would buy at that share.
