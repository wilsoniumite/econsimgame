# UNIT SUMS: see below.
# RUN (19 November 2026): it made chemicals, at coal 1.5 and electricity 1.2 a unit, and was never built on
# any island: at the island's prices its running cost alone was 6 to 11 times the price of chemicals, which
# the ammonia-soda works sell at about 1. Now it makes a good of its own, fertiliser, which the farms that
# keep nitrogen buy and nobody else does; and a unit of fertiliser is a tenth of the design's unit of fixed
# nitrogen, so that its recipe, its plant and its works' size are the design's over ten, and the farms'
# 0.03 a unit of grain is fertiliser a tenth as dear as the design's chemicals. At island 7's mean prices of
# 1930 (coal 0.44, electricity about 3 where a station stands, wage 10.1) a unit costs some 0.6 to run,
# where nitrogen pays a farm at any price below 12.5 times grain's (about 2.7) and pays every farm below
# about 0.4.
# Plant 13.5 a unit of monthly capacity at the design's base prices (2.5 years of output: building 4.05,
# steel 1.35, machinery 8.1).
