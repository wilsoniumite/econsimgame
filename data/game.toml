# ====================================================================================================
# Stage 6: the first content after 1900. Electricity and electrical goods (docs/rules/tree.md, "After
# 1900: electricity"). No hydro station: it needs the tree's water sites (stage 2), which are not built.
# No grid: electricity is not carried between towns, and every town that wants it builds its own station.
# Plant follows the design's rule for the content after 1900: so many years of the works' own output at
# base prices, of kind M (three tenths building work, a tenth steel, six tenths machinery, by value at
# base prices), written out here as the `capital` line.
# ====================================================================================================

# At base prices: sells 7.00; inputs 8.40 (steel 7.50, chemicals 0.45, glass 0.45), heat 0.38, labour 1.12
# (0.45 at a wage of 2.5); cost 9.90; margin -2.90 (-41%). No margin can be had at base prices: the steel
# alone is worth more than the unit, because steel's base price is the crucible's of 1750 (30), where the
# island of 1885 sells it at about 4. So the heat and labour are set by the tree's rule (a fifth) at the
# island's prices of 1885, the year it is aimed at (means of islands 1 to 4 under the game's rules with six
# families, on the build this stage was cut from: wage 8.52, steel 4.05, chemicals 1.68, glass 3.97, coal
# 0.467): inputs 1.38, heat 0.19, labour 3.83; cost 5.41 against 7.00, a margin of +1.59 (23%). At 7 a
# unit its five of household goods cost 1.4 apiece, beside pottery's 1.54 and paper's 1.48 that year.
# Plant 100.5 a unit of monthly capacity at base prices (1.2 years of output: building 30.1, steel 10.2,
# machinery 60.2); at 1885's prices 52.7, 7.5 months of output. About 18 hands at K0.
# K0 on the engine works' pattern: the same worth of output a month at base prices (4 units of machinery,
# 280; here 40 units), so that a first works, at 0.4 of it, is a small part of its town's trade.
# A new good, so it starts as good as its recipe and learns nothing (the tree's rule for the content after
# 1900: A0 1, no curve).
