[package]
name = "isostate-viewer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "default_app", "std", "bevy_winit", "default_font", "multi_threaded", "x11", "wayland",
    "3d_bevy_render", "ui_api", "ui_bevy_render", "png", "tonemapping_luts", "smaa_luts",
] }
bytemuck = "1.25.2"
isostate-core = { path = "../isostate-core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
