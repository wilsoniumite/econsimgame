# Isolated State: the game's content, as an overlay on data/content.toml. DRAFT, revised after its critique.
#
# The reference file stays as it is for the port. The game loads it and then this file:
#   - an entry ([[method]], [[sector]], [[tech]], a good, a row of [services.props]) whose name the
#     base file already has overrides it key by key: only the keys written here change, and a table
#     written here (inputs, capital, discover) replaces the base table whole;
#   - a new name is appended after the base entries, so the indices of the reference content do not move;
#   - the lists of [services] replace the base lists; a row of [services.props] adds to or changes the
#     needs it names and leaves the good's other needs alone.
#
# Every entry carries `stage`, and the stages are numbered in the order they are to be built, so a
# ceiling is enough: to build stage N, keep the entries with stage <= N. A good of a later stage does
# not exist, and any input, capital line, threshold or need that names it is dropped. Keys of a later
# stage on an earlier entry (a `site`) are ignored until their stage is built. So this one file is the
# content of every stage.
#
# Keys the present loader does not read, and the stage each belongs to:
#   goods:    decay (monthly loss of stock), stock0 (opening stock a head; also the opening guess of
#             monthly trade)                                                        stage 1
#   services: theta (the logit's width within each need; 0.25 for all today)          stage 1
#   method:   group (the family trade: without it no family can own the new works)    stage 1
#   method:   site = { field, kw } for water power: the works may stand only on a cell with that
#             field, and the works on a cell may draw no more power than the cell has (kw is what one
#             usual size draws); site = { field, weight } for wind and harbours: weight 0 means only
#             "must stand there"                                                      stage 2
#   sector:   ag (takes the tools and husbandry boosts, as farm and pasture do by name) stage 2
#   [world]                                                                           stage 3
#   tech:     sectors, inputs, boost (an improvement a land sector buys where it pays) stage 4
#   method:   seed (built in 1750 where its good is needed). Optional at any stage: without it the
#             1750 trades are founded in the warm-up decade, a works a year in each town.
#   target:   the year an invention is aimed at. Not read by the engine: it is for the threshold
#             fitter, which resets `discover` to what the island had made five years before.
#
# Numbers. Three kinds, kept apart:
#   - run: the methods on the sixteen base goods (edge-tool works, tool factory, hot blast, machine-tool
#     works, engineering works, continuous kiln, shops) and the changes to base methods were run under
#     the game's rules on sixteen seeds with a build of night/core: all are found within a few years of
#     the year aimed at and built, and the 1900 real wage is 3.4 times 1750's against 2.7 with the game's
#     own content. Hot blast's coal and iron thresholds were written in plain units after the critique,
#     at the median seed's value, which does not move the median and narrows the spread;
#   - reckoned at the game's prices: everything on a new good, from the engine's formulas with the wage
#     and the base goods' prices of those runs (wage 4.0 rising to 14.7; coal, stone and bricks falling
#     to about 0.9, 0.9 and 1.5). Not run: that binary cannot load a seventeenth good. Thresholds on new
#     goods are the reckoning's output about five years before the year aimed at, and want refitting
#     when this loads: see content-design.md, "For whoever builds this";
#   - asserted: engine changes, specified against the code.
#
# Steel stays at 3.0 as an implement: at 1.6 no steel is ever sold under the game's rules, the converter
# is never found and the land's machines never improve. Raw shelter IS re-rated here, for the game only
# (stone 0.3, bricks 0.6, timber 0.4): without it builders lose shelter back to heaped stone and kiln
# brick as wages rise, and quarrying is cut by three tenths where it should be halved.
#
# `group` is the family trade, in the six names the families have today: iron, textiles, coal,
# engineering, building, estates.
#
# The comment above each method gives its unit sums at base prices: what a unit sells for, what its
# inputs, heat (0.376 a unit at base prices, nearly all coal) and labour (at a wage of 2.5) cost on the
# recipe as written, the margin, and the plant. For an invention it then gives the entry test at the
# game's prices in the year it is found, with the engine's penalties for a small new works.

[meta]
goods = [
  # stage 1
  { name = "building", label = "Building work", weight = 12.0, price = 2.2, color = "#b08d6a", decay = 0.1, stock0 = 0.09, stage = 1 },
  { name = "lumber", label = "Sawn timber", weight = 1.2, price = 2.2, color = "#b98d54", decay = 0.004, stock0 = 0.02, stage = 1 },
  { name = "lime", label = "Lime and cement", weight = 1.5, price = 2.0, color = "#e2ddd0", decay = 0.01, stock0 = 0.03, stage = 1 },
  { name = "beer", label = "Beer", weight = 2.0, price = 2.0, color = "#b8742a", decay = 0.06, stock0 = 0.07, stage = 1 },
  { name = "pottery", label = "Pottery", weight = 1.0, price = 3.4, color = "#c9b08a", decay = 0.003, stock0 = 0.01, stage = 1 },
  { name = "gas", label = "Town gas", weight = 20.0, price = 2.4, color = "#e6c94f", decay = 0.15, stock0 = 0.0, stage = 1 },
  { name = "chemicals", label = "Soap and chemicals", weight = 0.9, price = 4.5, color = "#c9c23a", decay = 0.003, stock0 = 0.006, stage = 1 },
  { name = "glass", label = "Glass", weight = 1.0, price = 9.0, color = "#9fd0c8", decay = 0.003, stock0 = 0.003, stage = 1 },
  { name = "paper", label = "Paper", weight = 0.5, price = 4.6, color = "#f2ecd9", decay = 0.004, stock0 = 0.004, stage = 1 },
  # stage 2
  { name = "flour", label = "Flour", weight = 0.9, price = 1.4, color = "#efe6cf", decay = 0.02, stock0 = 0.5, stage = 2 },
  { name = "fish", label = "Fish", weight = 1.5, price = 1.3, color = "#7fa6b8", decay = 0.12, stock0 = 0.05, stage = 2 },
  { name = "produce", label = "Dairy, meat and garden produce", weight = 4.0, price = 1.6, color = "#9fbf5f", decay = 0.15, stock0 = 0.06, stage = 2 },
  # stage 3
  { name = "cotton", label = "Raw cotton", weight = 0.5, price = 2.2, color = "#f4f1e6", decay = 0.003, stock0 = 0.0, stage = 3 },
  { name = "cottons", label = "Cotton cloth", weight = 0.25, price = 6.0, color = "#5f8fc4", decay = 0.004, stock0 = 0.0, stage = 3 },
  # stage 5
  { name = "ships", label = "Ships", weight = 2.0, price = 160.0, color = "#39607a", decay = 0.002, stock0 = 0.00003, stage = 5 },
]
# The sixteen base goods take decay and stock0 from the tables they are in today, unchanged
# (P.decay in params.rs, `guess` in sim.rs); the loader should move those into the goods table.

[services]
# Two needs are added. "warmth" keeps its name and is shown as "Fuel and light": gas sells into it, and
# after 1900 so will whatever a household burns or switches on.
names = ["food", "warmth", "shelter", "clothing", "implements", "comfort", "table", "wares"]
labels = ["Food", "Fuel and light", "Shelter", "Clothing", "Implements", "Comfort", "Drink and groceries", "Household goods"]
subsistence = [1.0, 0.25, 0.06, 0.03, 0.002, 0.0, 0.0, 0.0]   # per head per month; unchanged, none for the new needs
shares = [0.25, 0.13, 0.2, 0.17, 0.07, 0.09, 0.06, 0.03]        # at subsistence and a bit (base: 0.28, 0.14, 0.22, 0.19, 0.07, 0.10)
shares_rich = [0.05, 0.06, 0.2, 0.17, 0.07, 0.28, 0.07, 0.1]   # far above it, for the Engel rule (its own six: 0.05, 0.06, 0.24, 0.22, 0.07, 0.36)
lord_shares = [0.03, 0.07, 0.28, 0.19, 0.07, 0.24, 0.04, 0.08]   # (base: 0.04, 0.08, 0.30, 0.22, 0.08, 0.28)
theta = [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 2.0]   # household goods are unlike each other: at 2.0 each keeps its share of the money

# From the trade stage clothing widens to 1.0: wool, woollen cloth and cotton cloth are then unlike
# enough that cotton takes the century to win and woollen cloth keeps a quarter of the need. Before
# cotton the base's 0.25 stands, as tuned. The loader applies each [[services.change]] whose stage it
# has reached, in order; the keys it names replace the lists.
[[services.change]]
stage = 3
theta = [0.25, 0.25, 0.25, 1.0, 0.25, 0.25, 0.25, 2.0]

[services.props]
# stage 1
building = { shelter = 3.0 }   # stone, brick and timber put up by men who know how
stone = { shelter = 0.3 }   # re-rated for the game (the port has 0.5): a household that heaps up its own wall gets a hovel
bricks = { shelter = 0.6 }   # re-rated (the port has 1.0)
timber = { shelter = 0.4, wares = 0.1 }   # shelter: re-rated (the port has 0.6); wares: treen: bowls and spoons whittled at home
lumber = { shelter = 0.6, wares = 0.35 }   # shelter: boards for a man who builds for himself; wares: plain furniture
lime = { shelter = 0.5 }   # limewash and plaster
grain = { table = 0.15 }   # home brewing
beer = { table = 1.0 }
pottery = { wares = 1.0 }
gas = { warmth = 4.5 }   # light is worth more than heat: the number gas's whole trade hangs on
chemicals = { wares = 1.3 }   # soap, candles and washing soda
glass = { wares = 2.5 }   # bottles, tableware and the window pane
paper = { wares = 1.3 }
# stage 2
flour = { food = 1.5 }   # grain made to go further
fish = { food = 1.1 }
produce = { food = 1.4 }
# stage 3
cottons = { clothing = 0.75 }

[heat]
# Unchanged: none of the new goods is burnt for heat in a works. Gas warms and lights houses only.

