[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isostate"
version = "0.1.0"
description = "An agent-based spatial economy on a procedural island, 1750 to 1900, with a replay viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.1"]

[project.scripts]
isostate = "isostate.cli:main"

[tool.setuptools]
packages = ["isostate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
