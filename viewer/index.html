<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Isolated State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("isostate-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --paper: #e6eae2; --surface: #f4f6f1; --surface-2: #ebeee7; --ink: #1b2836; --ink-2: #485564; --ink-3: #75808b;
  --rule: #c8d0c5; --grid: #dde3da; --axis: #b3bcb1; --accent: #1f4e79; --on-accent: #f4f6f1; --accent-soft: #d7e2ea;
  --s1: #2b6cb0; --s2: #d2642c; --s3: #1f9a74; --s4: #d39a1a; --s5: #b04f86; --s6: #4f8a2a;
  --map-bg: #c4d6dc; --halo: rgba(244, 246, 241, .9); --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 6px 18px rgba(20, 30, 40, .10);
  --k-discovery: #9a6a0e; --k-railway: #1b2836; --k-rail_plan: #5d6a78; --k-milestone: #3b7346; --k-crossing: #1d6a73;
  --k-steep: #6b4d8a; --k-alarm: #9b2f28; --k-verdict: #555b66; --k-famine: #7a1f1f; --k-town: #7a5a32; --k-closure: #86909a; --k-first: #9a6a0e;
  --display: "IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #10151a; --surface: #171d23; --surface-2: #1d242b; --ink: #dfe5ea; --ink-2: #a3afba; --ink-3: #77838e;
  --rule: #2b353f; --grid: #242c34; --axis: #3b4651; --accent: #8db8e3; --on-accent: #10151a; --accent-soft: #1f3346;
  --s1: #4a88cf; --s2: #d0683a; --s3: #23a07a; --s4: #b98a1c; --s5: #c45b95; --s6: #5a9638;
  --map-bg: #26353c; --halo: rgba(23, 29, 35, .88); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .35);
  --k-discovery: #d6a43c; --k-railway: #dfe5ea; --k-rail_plan: #93a0ad; --k-milestone: #6fae7a; --k-crossing: #5fb3bc;
  --k-steep: #a98bd0; --k-alarm: #e0796e; --k-verdict: #a3a9b3; --k-famine: #e07a7a; --k-town: #c79c68; --k-closure: #77838e; --k-first: #d6a43c;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body { -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 2px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.05; margin: 0; letter-spacing: .01em; }
.brand .tag { font-size: 12.5px; color: var(--ink-2); }
.hbtns { display: flex; gap: 6px; flex: none; }
.pill { appearance: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.pill:hover { border-color: var(--ink-3); }
#vitals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 12px; padding: 6px 14px 10px; }
.vital { min-width: 0; }
.vital .lab { font-family: var(--display); font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vital .val { font-size: 18px; font-weight: 500; line-height: 1.15; white-space: nowrap; }
.vital canvas { display: block; width: 100%; height: 16px; margin-top: 3px; }
#mapwrap { position: relative; height: min(60svh, calc(72vw + 100px)); min-height: 300px; background: var(--map-bg); overflow: hidden; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); touch-action: none; user-select: none; -webkit-user-select: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#mapwrap.dragging #map { cursor: grabbing; }
#layers { position: absolute; left: 8px; right: 52px; top: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px; }
#layers::-webkit-scrollbar { display: none; }
.chip { appearance: none; flex: none; border: 1px solid var(--rule); background: var(--halo); border-radius: 999px; height: 30px; padding: 0 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
select.chip { padding: 0 8px; }
select.chip[hidden] { display: none; }
#mapbtns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mbtn { appearance: none; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--rule); background: var(--halo); cursor: pointer; font-size: 17px; line-height: 1; display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.mbtn.small { font-size: 12px; font-family: var(--display); }
#bigyear { position: absolute; right: 12px; bottom: 4px; font-family: var(--display); font-size: 46px; line-height: 1; pointer-events: none; color: var(--ink); text-shadow: 0 0 8px var(--halo), 0 0 3px var(--halo), 0 0 1px var(--halo); }
#legend { position: absolute; left: 8px; bottom: 8px; max-width: min(300px, calc(100% - 140px)); max-height: calc(100% - 60px); overflow: auto; background: var(--halo); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.3; display: none; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#legend.open { display: block; }
#legend .lg-t { font-family: var(--display); font-size: 13.5px; margin-bottom: 4px; }
#legend .rows { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
@media (min-width: 900px) { #legend { max-width: 360px; } #legend .rows { grid-template-columns: 1fr 1fr; } }
#legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
#legend .sw { width: 14px; height: 10px; border-radius: 2px; flex: none; border: 1px solid rgba(0, 0, 0, .15); }
#legend .ln { width: 18px; height: 0; flex: none; }
#legend .ramp { height: 10px; border-radius: 2px; margin: 4px 0 2px; }
#legend .rl { display: flex; justify-content: space-between; color: var(--ink-2); }
#toasts { position: absolute; left: 8px; top: 46px; width: min(380px, calc(100% - 60px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 3; }
.toast { pointer-events: auto; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--kc); border-radius: 8px; padding: 7px 10px 8px; box-shadow: var(--shadow); animation: tin .35s ease-out; cursor: pointer; transition: opacity .45s, transform .45s; }
.toast.out { opacity: 0; transform: translateY(-6px); }
.toast .tk { font-family: var(--display); font-size: 12.5px; color: var(--ink-2); }
.toast .tk .g { color: var(--kc); }
.toast .tt { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
#peek { position: absolute; left: 8px; bottom: 8px; width: min(300px, calc(100% - 110px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.3; z-index: 2; }
#peek[hidden] { display: none; }
#peek .pk-t { font-weight: 600; font-size: 14px; padding-right: 22px; }
#peek .pk-s { color: var(--ink-2); margin-top: 2px; }
#peek .pk-more { appearance: none; border: none; background: none; color: var(--accent); padding: 4px 0 0; cursor: pointer; font-size: 13px; }
#peek .x { position: absolute; right: 4px; top: 2px; appearance: none; border: none; background: none; font-size: 20px; line-height: 1; padding: 4px 6px; cursor: pointer; color: var(--ink-2); }
#timeline { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--rule); }
#play { appearance: none; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); cursor: pointer; flex: none; display: flex; align-items: center; justify-content: center; }
#play svg { width: 18px; height: 18px; fill: currentColor; }
#track { position: relative; flex: 1; height: 46px; cursor: pointer; touch-action: none; outline: none; border-radius: 6px; }
#track:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
#ticks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#speed { flex: none; }
#panel { background: var(--surface); flex: 1; min-height: 60vh; }
#tabs { display: flex; position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
#tabs button { flex: 1; appearance: none; background: none; border: none; border-bottom: 2px solid transparent; padding: 11px 4px 9px; font-family: var(--display); font-size: 16.5px; color: var(--ink-2); cursor: pointer; }
#tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { display: none; padding: 12px 14px 48px; }
.pane.on { display: block; }
.pane h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 18px 0 6px; line-height: 1.15; }
.pane h2:first-child { margin-top: 2px; }
.pane h3 { font-family: var(--display); font-weight: 400; font-size: 16.5px; margin: 14px 0 4px; }
.pane p { margin: 6px 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { appearance: none; border: none; background: none; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.newshead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.newshead .count { font-size: 13px; color: var(--ink-2); }
ol.news { list-style: none; margin: 0; padding: 0; }
ol.news li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 6px; }
ol.news li:hover { background: var(--surface-2); }
ol.news li.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.ev-year { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; padding-top: 1px; }
.ev-k { font-family: var(--display); font-size: 12.5px; color: var(--ink-2); }
.ev-k .g { color: var(--kc); display: inline-block; min-width: 1em; }
.ev-t { font-weight: 600; line-height: 1.25; }
.ev-x { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.emptynote { color: var(--ink-2); font-style: italic; padding: 10px 0; }
figure.chart { margin: 4px 0 18px; }
figure.chart figcaption { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
figure.chart .ct { font-weight: 600; font-size: 14.5px; }
figure.chart .cu { font-size: 12.5px; color: var(--ink-2); }
figure.chart .cv { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 2px 12px; min-height: 18px; }
figure.chart .cv .yr { color: var(--ink-2); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
figure.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; cursor: crosshair; }
figure.chart svg text { font-family: var(--body); font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
figure.chart svg text.el { fill: var(--ink-2); font-size: 11.5px; }
.chart-note { font-size: 13px; color: var(--ink-2); margin: -10px 0 16px; }
.multiples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 6px 0 18px; }
.mini .mt { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.mini .mt b { font-weight: 600; }
.mini .mv { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini svg { display: block; width: 100%; height: 46px; overflow: visible; cursor: crosshair; touch-action: pan-y; }
.segrow { margin: 6px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.segrow .chip { background: var(--surface); height: 28px; font-size: 13px; }
.segrow .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
details.table { margin: 8px 0 20px; }
details.table summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.tablewrap { overflow-x: auto; }
table.nums { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 8px; width: 100%; }
table.nums th, table.nums td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.nums th { font-weight: 600; color: var(--ink-2); }
table.nums td:first-child, table.nums th:first-child { text-align: left; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 14px; margin: 6px 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: 112px 1fr 38px; gap: 3px 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.bar { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; }
.bars .bv { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.firm { border: 1px solid var(--rule); border-radius: 10px; padding: 9px 11px; margin: 8px 0; background: var(--surface-2); }
.firm .fn { font-weight: 600; }
.firm .fm { color: var(--ink-2); font-size: 13px; }
.firm details { margin-top: 6px; }
.firm summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
.why { font-size: 13.5px; }
.why table { border-collapse: collapse; width: 100%; margin: 6px 0; font-variant-numeric: tabular-nums; }
.why td { padding: 2px 4px; border-bottom: 1px solid var(--grid); }
.why td.n { text-align: right; white-space: nowrap; }
.why tr.tot td { font-weight: 600; border-bottom: none; }
.ptab { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.ptab td { padding: 2px 4px; border-bottom: 1px solid var(--grid); }
.ptab td.n { text-align: right; }
.up { color: var(--k-alarm); } .down { color: var(--k-milestone); }
.hint { background: var(--surface-2); border: 1px dashed var(--rule); border-radius: 10px; padding: 12px; color: var(--ink-2); }
.linkish { appearance: none; border: none; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.about p, .about li { max-width: 62ch; }
.about ul { padding-left: 18px; }
#err { position: fixed; left: 8px; right: 8px; bottom: 8px; background: #9b2f28; color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 100; font-size: 13px; line-height: 1.35; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: var(--paper); z-index: 50; text-align: center; padding: 24px; }
#loading .lt { font-family: var(--display); font-size: 34px; }
#loading .ls { color: var(--ink-2); }
@media (max-width: 899px) {
  .toast { padding: 5px 9px 6px; }
  .toast .tt { font-size: 14px; }
}
@media (min-width: 900px) {
  #toasts { left: 50%; transform: translateX(-50%); }
  #app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
  header { grid-column: 1; grid-row: 1; padding: 12px 18px 2px; }
  #vitals { grid-column: 1; grid-row: 2; padding: 6px 18px 10px; max-width: 760px; }
  #mapwrap { grid-column: 1; grid-row: 3; height: auto; min-height: 0; }
  #timeline { grid-column: 1; grid-row: 4; border-bottom: none; padding: 10px 18px; }
  #panel { grid-column: 2; grid-row: 1 / 5; border-left: 1px solid var(--rule); overflow-y: auto; min-height: 0; }
  #peek { display: none !important; }
  #bigyear { font-size: 60px; right: 18px; bottom: 8px; }
  .brand h1 { font-size: 27px; }
}
@media (prefers-reduced-motion: reduce) { .toast, ol.news li.flash { animation: none; } }
</style>
</head>
<body>
<div id="loading" role="status"><div class="lt">Isolated State</div><div class="ls">Unrolling the map&hellip;</div><noscript><p>This page needs JavaScript to draw the map.</p></noscript></div>
<div id="app">
  <header>
    <div class="brand"><h1>Isolated State</h1><div class="tag" id="tagline">An island economy, 1750 to 1900, grown by its own agents</div></div>
    <div class="hbtns"><button class="pill" id="themeBtn" aria-label="Switch between light and dark">Dark</button></div>
  </header>
  <section id="vitals" aria-label="Vital statistics"></section>
  <section id="mapwrap" aria-label="Map of the island">
    <canvas id="map"></canvas>
    <div id="layers" role="toolbar" aria-label="Map layer"></div>
    <div id="mapbtns">
      <button class="mbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="mbtn" id="zout" aria-label="Zoom out">&minus;</button>
      <button class="mbtn" id="zfit" aria-label="Show the whole island">&#10530;</button>
      <button class="mbtn small" id="keyBtn" aria-label="Show the key" aria-pressed="false">Key</button>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="legend"></div>
    <div id="peek" hidden><button class="x" aria-label="Close">&times;</button><div class="pk-t"></div><div class="pk-s"></div><button class="pk-more">Details &darr;</button></div>
    <div id="bigyear">1900</div>
  </section>
  <section id="timeline">
    <button id="play" aria-label="Play"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z"/></svg></button>
    <div id="track" tabindex="0" role="slider" aria-label="Year" aria-valuemin="1750" aria-valuemax="1900" aria-valuenow="1900"><canvas id="ticks"></canvas></div>
    <button class="pill" id="speed" aria-label="Playback speed">1&times;</button>
  </section>
  <aside id="panel">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="news" aria-selected="true">News</button>
      <button role="tab" data-tab="charts" aria-selected="false">Charts</button>
      <button role="tab" data-tab="inspect" aria-selected="false">Inspect</button>
      <button role="tab" data-tab="about" aria-selected="false">About</button>
    </nav>
    <div class="pane on" id="pane-news"></div>
    <div class="pane" id="pane-charts"></div>
    <div class="pane" id="pane-inspect"></div>
    <div class="pane about" id="pane-about"></div>
  </aside>
</div>

    html += "<tr><td>" + esc(h.goods[g].label) + '</td><td class="n">' + fmtNum(p) + '</td><td class="n ' + (d > 0.05 ? "up" : d < -0.05 ? "down" : "muted") + '">' + (Math.abs(d) < 0.05 ? "about average" : (d > 0 ? "+" : "−") + Math.round(Math.abs(d) * 100) + "%") + "</td></tr>";

  html += "</tbody></table>";
  var yr = R.y0 + k, techs = h.techs.map(function (x, j) { return [x, j]; }).filter(function (x) { return !x[0].known && x[0].year >= 0 && x[0].year <= yr; });
  if (techs.length) {
    html += '<h3>Know-how</h3><p class="small muted">How far each new method has reached this town. Know-how spreads along trade routes and grows with use.</p><div class="bars">';
    techs.forEach(function (x) { var v = A.town_know[i * R.NT + x[1]] / 255; html += "<span>" + esc(x[0].label) + '</span><span class="bar"><i style="width:' + Math.round(v * 100) + '%;background:var(--s1)"></i></span><span class="bv">' + Math.round(v * 100) + "%</span>"; });
    html += "</div>";
  }
  var fs = [];
  h.firms.forEach(function (F, f) { if (F.town !== t) return; var K = firmK(R, f, k); if (K > 0) fs.push([f, K / (h.methods[F.method].K0 || 1), K]); });
  fs.sort(function (a, b) { return b[1] - a[1]; });
  if (fs.length) {
    html += "<h3>Largest works</h3><p class=\"small muted\">" + fs.length + " works trade through " + esc(town.name) + ". Tap one to find it.</p>";
    fs.slice(0, 6).forEach(function (o) { var F = h.firms[o[0]], m = h.methods[F.method]; html += '<div class="firm"><div class="fn"><button class="linkish" data-cell="' + F.cell + '">' + esc(F.name) + '</button></div><div class="fm">' + esc(m.label) + ", " + o[1].toFixed(1) + " times a standard works</div></div>"; });
  }
  return html;
}
function showPeek() {
  if (window.innerWidth >= 900 || !st.sel) return;
  var R = st.run, k = st.k, A = R.A, pk = $("#peek"), t1, t2;
  if (st.sel.type === "town") {
    var i = k * R.T + st.sel.t; t1 = R.h.towns[st.sel.t].name;
    t2 = A.town_active[i] ? fmtPop(A.town_urban[i]) + " in town, " + fmtPop(A.town_pop[i]) + " in its market area" : "Not founded yet";
  } else {
    var c = st.sel.c, off = k * R.N, u = R.h.uses[A.use[off + c]], tt = A.catch[off + c] - 1, fs = firmsNear(R, c, k).filter(function (o) { return o.here; });
    t1 = (USE_LABEL[u] || u) + (tt >= 0 ? " near " + R.h.towns[tt].name : "");
    t2 = "Rent " + fmtNum(rentValue(A.rent[off + c]), 2) + " a month" + (fs.length ? ", " + fs.length + (fs.length === 1 ? " works" : " works") + " here" : "");
  }
  pk.querySelector(".pk-t").textContent = t1; pk.querySelector(".pk-s").textContent = t2;
  pk.hidden = false; toggleLegend(false);
}
function hidePeek() { $("#peek").hidden = true; }
function setupPeek() {
  $("#peek .x").onclick = function () { hidePeek(); st.sel = null; renderInspect(); requestDraw(); };
  $("#peek .pk-more").onclick = function () { showTab("inspect"); $("#panel").scrollIntoView({ behavior: "smooth", block: "start" }); };
}

// ------------------------------------------------------------------ about
function renderAbout() {
  var R = st.run, m = R.h.meta, alt = st.alt;
  $("#pane-about").innerHTML =
    "<h2>What you are looking at</h2>" +
    "<p>An island of " + Math.round(R.N * 4).toLocaleString("en-GB") + " square kilometres, simulated month by month from " + R.y0 + " to " + (R.y0 + R.ny - 1) + ". Nothing on the map was placed by hand. Farmers, landlords, investors and railway promoters act on the prices they can see, and the patterns come out of those choices: farm belts around the market towns, ironworks moving onto the coalfields, roads where the carts go, railways where the roads are busiest.</p>" +
    "<h2>How it works</h2>" +
    "<p>Every month each town’s markets clear. Households and landlords spend on six needs: food, warmth, shelter, clothing, implements and comfort. Any good that serves a need can be bought for it, at its own efficiency, so a little steel finds a use as a better tool long before anyone rolls steel rails. Prices move with stocks, wages clear each town’s labor market, and money is counted to the penny every month.</p>" +
    "<p>Every year each square of land goes to whoever bids most for it. A bid is what the land earns at the nearest market after carting, so the rings Johann von Thünen described in his <i>Isolated State</i> of 1826 form on their own and then bend around rivers, roads and rails.</p>" +
    "<p>Investors in each town price candidate sites for every method they know and build where the return is best. Each works keeps the sums that put it there: tap one on the map and open “Why here?”.</p>" +
    "<p>Inventions are not unlocked from a tree. A method becomes likely once the island has handled enough of what it combines, coal and iron for coke smelting, machinery and cloth for powered mills, and it appears first where those goods are worked. It then spreads to other towns along trade routes and gets cheaper with use.</p>" +
    "<p>The news is written by an observer that only watches the numbers. It reports thresholds crossed, doublings, one method overtaking another, and years far off their trend, which it labels booms, gluts, shortages or slumps from the direction of price and output together. Downturns are flagged as they happen and named later, in hindsight, once the trough is known.</p>" +
    "<h2>Reading it</h2><ul>" +
    "<li><b>Play</b> runs the years forward. Major news appears on the map as it happens.</li>" +
    "<li><b>Layers</b> switch the map between land use, rent, market areas, prices by good, and what the ground holds.</li>" +
    "<li><b>Inspect</b> shows any square or town in the chosen year.</li>" +
    "<li><b>Charts</b> follow the year you are in; tap one to jump.</li></ul>" +
    "<h2>What this first demo gets wrong</h2>" +
    "<p>Towns grow, but the share of people living in them barely moves: industry here never pulls labor off the land the way it did in Britain, so this is an industrious revolution more than an industrial one. Some industrial prices swing far more than they should. There is one island, one seed, no foreign trade and no government, and money grows at a fixed rate. Firms remember why they were founded but do not yet plan beyond the next year.</p>" +
    "<h2>This run</h2>" +
    '<dl class="kv"><dt>Scenario</dt><dd>' + esc(m.label || m.rent_regime) + "</dd>" + (alt ? "<dt>Compared with</dt><dd>" + esc(alt.h.meta.label) + " (charts only)</dd>" : "") + "<dt>Seed</dt><dd>" + m.seed + "</dd><dt>Map</dt><dd>" + m.W + " by " + m.H + " squares of 2 km</dd><dt>Works founded</dt><dd>" + R.h.firms.length.toLocaleString("en-GB") + "</dd><dt>Generated</dt><dd>" + esc(m.generated) + "</dd></dl>" +
    '<p class="small muted">Made with the <code>isostate</code> Python package. Every number here comes from one deterministic run; rerun with another seed for another island.</p>';
}

// ------------------------------------------------------------------ hash, theme, boot
function writeHash() {
  if (st.playing) return;
  try { history.replaceState(null, "", "#y=" + (st.run.y0 + st.k)); } catch (e) { }
}
function readHash() {
  var m = /y=(\d{4})/.exec(location.hash || "");
  if (!m) return null;
  return clamp(+m[1] - st.run.y0, 0, st.run.ny - 1);
}
function setupTheme() {
  $("#themeBtn").onclick = function () {
    var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("isostate-theme", t); } catch (e) { }
    themeLabel(); drawTicks(); renderVitals(); requestDraw();
  };
  themeLabel();
}
function themeLabel() {
  $("#themeBtn").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "Light" : "Dark";
}
function boot() {
  var els = Array.prototype.slice.call(document.querySelectorAll("script.run-data"));
  if (!els.length) { $("#loading .ls").textContent = "No run is embedded in this page. Build it with: python -m isostate build"; return; }
  Promise.all(els.map(function (el) { return decodeRun(el.textContent.trim(), el.dataset.key); })).then(function (runs) {
    runs.forEach(function (R) { st.runs[R.key] = R; st.keys.push(R.key); });
    st.run = runs.filter(function (R) { return !R.lite; })[0] || runs[0];
    st.alt = runs.filter(function (R) { return R !== st.run; })[0] || null;
    var R = st.run;
    $("#track").setAttribute("aria-valuemin", R.y0); $("#track").setAttribute("aria-valuemax", R.y0 + R.ny - 1);
    $("#tagline").textContent = "An island economy, " + R.y0 + " to " + (R.y0 + R.ny - 1) + ", grown by its own agents";
    setupMap(); setupMapInput(); setupLayers(); setupTimeline(); setupVitals(); setupTabs(); setupPeek(); setupTheme();
    renderLegend(); renderAbout(); renderInspect(); setupCharts();
    if (window.innerWidth >= 900) toggleLegend(true);
    var h0 = readHash();
    st.t = h0 != null ? h0 : R.ny - 1;
    $("#loading").remove();
    sizeCanvas();
    applyYear(true);
    draw();
    layoutCharts();
    new ResizeObserver(function () { sizeCanvas(); drawTicks(); renderVitals(); }).observe($("#mapwrap"));
    var lastW = 0;
    new ResizeObserver(function (en) { var w = Math.round(en[0].contentRect.width); if (w !== lastW) { lastW = w; layoutCharts(); } }).observe($("#panel"));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { requestDraw(); drawTicks(); });
  }).catch(function (err) {
    console.error(err);
    var ls = $("#loading .ls");
    if (ls) ls.textContent = "Sorry, the map could not be opened: " + (err && err.message ? err.message : err);
    else showError((err && err.message ? err.message : err) + (err && err.stack ? " | " + String(err.stack).split("\n").slice(0, 3).join(" | ") : ""));
  });
}
boot();
})();
</script>
